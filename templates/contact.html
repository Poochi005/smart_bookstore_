{% extends "base.html" %}
{% block title %}Contact - Smart Bookstore{% endblock %}
{% block content %}
<section>
    <h2>Contact</h2>
    <p>Smart Bookstore Management System. Built with HTML, CSS, Python, Flask and SQLite.</p>
    <form method="post" action="{{ url_for('contact') }}">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ form.name }}" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ form.email }}" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" minlength="10" required>{{ form.message }}</textarea>

        <button type="submit">Send Message</button>
    </form>
</section>
{% endblock %}
